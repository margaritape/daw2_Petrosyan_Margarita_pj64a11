<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OptiOrder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="glasses.png" alt="OptiOrder logo" width="250" style="object-fit:cover; border-radius: 50%;">
    <h1>OptiOrder</h1>
    <p>Optics Order Management Application</p>

    <p id="errorMessage" class="error"></p>

    <button onclick="window.location.href='documentation.html'">
        Application Documentation
    </button>

    <button onclick="window.location.href='login.html'">
        Login
    </button>

    <script>
        var parameters = new URLSearchParams(window.location.search);

        if (parameters.get("error") == "authentication") {
            document.getElementById("errorMessage").textContent =
                "Authentication error: incorrect username or password.";
        }
    </script>
</body>
</html>
