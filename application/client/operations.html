<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OptiOrder - Operations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Operations Menu</h1>

    <label for="operation">Select an operation:</label>
    <select id="operation">
        <option value="createOrder.html">Create a New Order</option>
        <option value="viewOrders.html">View Orders</option>
    </select>

    <button onclick="accessOperation()">Access</button>

    <br><br>

    <button onclick="window.location.href='index.html'">
        Back to Home
    </button>

    <script>
        function accessOperation() {
            var operation = document.getElementById("operation").value;
            window.location.href = operation;
        }
    </script>
</body>
</html>
